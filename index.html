<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre BTC</title>
    <meta name="description" content="Cofre criptografado offline para seeds de carteiras Bitcoin">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3B82F6">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-card: #1E293B;
            --accent: #3B82F6;
            --accent-light: #60A5FA;
            --text: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --warning-bg: rgba(251, 191, 36, 0.1);
            --warning-border: rgba(251, 191, 36, 0.3);
            --warning-text: #FBBF24;
        }

        body {
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 8px;
        }

        .warning-box {
            background: var(--warning-bg);
            border: 1px solid var(--warning-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 30px;
        }

        .warning-text {
            color: var(--warning-text);
            font-size: 14px;
            line-height: 1.6;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .card h2 {
            font-size: 20px;
            margin-bottom: 24px;
            color: var(--text);
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-light);
            border: 2px solid var(--accent);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .footer-note {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🔒</div>
        <h1>Cofre BTC</h1>
        <p class="subtitle">Seed storage — seguro, offline e privado</p>
    </div>

    <div class="warning-box">
        <p class="warning-text">⚠️ <strong>Seu cofre, suas chaves.</strong> Nenhum dado sai do seu aparelho. Sempre mantenha uma cópia em papel como fonte verdadeira. Perder a senha = sem recuperação.</p>
    </div>

    <div class="card">
        <h2>Bem-vindo</h2>
        <button class="btn btn-primary" onclick="criarCofre()">
            📦 Criar Novo Cofre
        </button>
        <button class="btn btn-secondary" onclick="abrirCofre()">
            📂 Abrir Cofre Existente
        </button>
    </div>

    <div class="footer-note">
        🔐 Seus dados ficam apenas no seu aparelho.<br>
        Sempre faça backup em papel.
    </div>

    <script>
        function criarCofre() {
            alert('Funcionalidade: Criar novo cofre\n\nDigite sua seed e defina uma senha para protegê-la.');
        }

        function abrirCofre() {
            alert('Funcionalidade: Abrir cofre existente\n\nDigite sua senha para acessar sua seed.');
        }
    </script>

    <!-- ✅ REGISTRO DO SERVICE WORKER -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registro = await navigator.serviceWorker.register('./service-worker.js');
          console.log('✅ SW carregado:', registro.scope);
        } catch (erro) {
          console.log('❌ Erro no SW:', erro);
        }
      });
    }
    </script>

</body>
</html>
